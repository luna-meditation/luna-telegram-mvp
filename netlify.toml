[build]
  command = "pnpm --filter @luna/frontend build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.15.0"

# Verified Luna Intelligence release; build requires current source-bound evidence.
[context.production]
  command = "pnpm --filter @luna/frontend build:production"

[context.production.environment]
  LUNA_RELEASE_PROFILE = "intelligence"
  LUNA_RELEASE_DB_REVIEW = "../qa/meet-luna4-release-review.json"
  VITE_FEATURE_LUNA_INTELLIGENCE = "true"
  VITE_FEATURE_ADMIN_V4 = "true"
  VITE_FEATURE_COSMOS_V2 = "true"
  VITE_FEATURE_AI_VOICE_INPUT = "true"
  VITE_FEATURE_BREATHWORK_GUIDED = "false"
  VITE_FEATURE_AI_CENTRAL_EXPERIENCE = "true"
  VITE_FEATURE_PERSONALIZATION = "true"
  VITE_FEATURE_PERSONAL_MEMORY = "true"
  VITE_FEATURE_AI_MODES = "true"
  VITE_FEATURE_TAROT_HISTORY = "true"
  VITE_FEATURE_TAROT_AI = "true"
  VITE_FEATURE_NEW_NAVIGATION = "true"
  VITE_FEATURE_TAROT_DAILY = "true"
  VITE_FEATURE_TAROT_SPREADS = "true"
  VITE_FEATURE_ASTROLOGY = "true"
  VITE_FEATURE_MOON_SEEDS_WALLET_V2 = "true"
  VITE_FEATURE_MOON_SEEDS_PURCHASES = "true"
  VITE_FEATURE_BREATHWORK_AUDIO = "true"
  VITE_FEATURE_DAILY_CARD_V2 = "true"
  VITE_FEATURE_ECONOMY_REWARDS_V2 = "false"
  VITE_FEATURE_TAROT_PAID_READINGS = "true"
  VITE_FEATURE_PAYMENT_ATOMIC = "true"
  VITE_FEATURE_PREMIUM_V2 = "false"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
