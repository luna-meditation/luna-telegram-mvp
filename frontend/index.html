<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030612" />
    <script>
      (() => {
        const key = 'luna.theme.preference.v1';
        let preference = 'system';
        try {
          const stored = window.localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch {}
        const resolved = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'dark' ? '#030612' : '#f8f5f1');
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest?v=20260718-2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/luna-favicon-v2-20260718.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/luna-apple-touch-v2-20260718.png" />
    <title>LUNA — AI Guided Meditation</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
