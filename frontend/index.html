<!doctype html>
<html lang="en" data-theme="dark" data-theme-preference="dark" style="color-scheme:dark;background:#030612">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030612" />
    <script>
      (() => {
        const key = 'luna.theme.preference.v1';
        const preference = 'dark';
        try {
          window.localStorage.setItem(key, 'dark');
        } catch {}
        const resolved = 'dark';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = resolved;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030612');
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest?v=20260718-2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/luna-favicon-v2-20260718.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/luna-apple-touch-v2-20260718.png" />
    <meta name="description" content="Luna — your personal AI guide to self-discovery. A little magic. A lot of clarity." />
    <title>Luna — Your Personal AI Guide to Self-Discovery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
